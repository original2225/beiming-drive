<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>北冥云盘</title>
  <link rel="icon" href="/favicon.png" />
  <style>
    :root {
      --brand: #5b6cff;
      --brand-deep: #4453d6;
      --brand-soft: #eef0ff;
      --ink: #16192a;
      --ink-2: #4a5169;
      --ink-3: #8a90a6;
      --line: #e6e8f0;
      --bg: #f7f8fc;
      --card: #ffffff;
      --ok: #17b26a;
      --warn: #f79009;
      --danger: #f04438;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(22,25,42,.06), 0 8px 24px rgba(22,25,42,.04);
    }
    * { box-sizing: border-box; }
    html, body, #app { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; }
    input { font-family: inherit; }
    a { color: var(--brand); text-decoration: none; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #cdd2e0; border-radius: 6px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-track { background: transparent; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 36px; padding: 0 14px; border-radius: 10px;
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      font-size: 13.5px; font-weight: 500; transition: .16s;
      white-space: nowrap;
    }
    .btn:hover { border-color: #cfd4e4; background: #fafbff; }
    .btn-primary {
      background: linear-gradient(135deg, var(--brand), var(--brand-deep));
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 12px rgba(91,108,255,.28);
    }
    .btn-primary:hover { filter: brightness(1.06); background: linear-gradient(135deg, var(--brand), var(--brand-deep)); }
    .btn-danger { color: var(--danger); border-color: #ffd5d2; }
    .btn-danger:hover { background: #fff5f4; }
    .btn-sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .input {
      height: 36px; padding: 0 12px; border-radius: 10px;
      border: 1px solid var(--line); background: #fff; font-size: 13.5px;
      color: var(--ink); outline: none; transition: .16s; width: 100%;
    }
    .input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(91,108,255,.12); }
    .input::placeholder { color: var(--ink-3); }

    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
    .muted { color: var(--ink-3); }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
    .tag-ok { background: #e7f8f0; color: var(--ok); }
    .tag-run { background: #eef0ff; color: var(--brand); }
    .tag-fail { background: #ffeceb; color: var(--danger); }
    .tag-warn { background: #fff6e6; color: var(--warn); }
    .tag-idle { background: #f0f1f6; color: var(--ink-3); }

    .empty { text-align: center; padding: 64px 20px; color: var(--ink-3); font-size: 13.5px; }
    .spinner {
      width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
