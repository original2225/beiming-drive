server:
  port: 8140
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: -1

spring:
  application:
    name: beiming-drive
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/beiming_drive}
    username: ${DB_USER:beiming}
    # 不提供默认值：没设 DB_PASSWORD 就启动失败，避免拿公开的示例密码上线
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
  servlet:
    multipart:
      max-file-size: 8GB
      max-request-size: 8GB
      file-size-threshold: 2MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

drive:
  web:
    dist: ${DRIVE_WEB_DIST:/app/web}
  storage:
    root: ${DRIVE_STORAGE_ROOT:/data/blobs}
    # 孤儿 blob 清扫的冷静期：刚写进磁盘、节点还没入库的文件正在这个窗口里，
    # 不能当成孤儿删掉。上传大文件 + 网络慢的时候这个窗口要够长。
    gc-grace-minutes: ${DRIVE_GC_GRACE_MINUTES:30}
  trash:
    # 回收站保留天数，到期由 TrashCleanupJob 自动彻底删除并释放磁盘
    retention-days: ${DRIVE_TRASH_RETENTION_DAYS:30}
    # 每天凌晨 3 点跑。改这个要确认容器时区是 Asia/Shanghai（Dockerfile 里已设 TZ）
    cron: ${DRIVE_TRASH_CRON:0 0 3 * * *}
    enabled: ${DRIVE_TRASH_ENABLED:true}
  auth:
    # 不提供默认值：没设 DRIVE_JWT_SECRET 就启动失败，避免拿公开的示例密钥上线
    jwt-secret: ${DRIVE_JWT_SECRET}
    token-ttl-hours: 168
  upload:
    default-chunk-size: 8388608   # 8MiB
  remote:
    workers-max: 32
    work-dir: ${DRIVE_WORK_DIR:/data/remote}
    chunk-size: 8388608
  search:
    # Lucene 索引目录。放在卷上才能重启后保留；丢了会在启动时自动全量重建。
    index-dir: ${DRIVE_SEARCH_INDEX:/data/search-index}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    games.beiming.drive: INFO